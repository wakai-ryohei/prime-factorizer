<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>素因数分解ツール</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <h1><span class="mark">🔢</span>素因数分解ツール</h1>
  <p class="sub">2 以上の整数を素因数分解します。桁数の上限はありません（BigInt 使用）。計算は Web Worker で実行するため、時間がかかる場合は途中経過が表示されます。</p>

  <div class="card">
    <label for="input">分解する整数</label>
    <div class="row">
      <input type="text" id="input" inputmode="numeric" placeholder="例: 600851475143" autocomplete="off" spellcheck="false">
      <button id="run">分解する</button>
      <button id="cancel" class="ghost hidden">中止</button>
    </div>
    <div id="error" class="error hidden"></div>
    <div class="samples">
      <span>サンプル:</span>
      <button class="chip" data-v="600851475143">600851475143</button>
      <button class="chip" data-v="18446744073709551617">2<sup>64</sup>+1</button>
      <button class="chip" data-v="147573952589676412927">2<sup>67</sup>−1</button>
      <button class="chip" data-v="100000000000880000000001887">27 桁（14 桁 × 14 桁）</button>
      <button class="chip" data-v="1000000000000128000000000003367">31 桁（16 桁 × 16 桁）</button>
    </div>
  </div>

  <div class="card hidden" id="progress-card">
    <div class="phase" id="phase"></div>
    <div class="bar" id="bar"><i></i></div>
    <div class="stats">
      <div class="stat"><div class="k">経過時間</div><div class="v" id="p-elapsed">0.00 秒</div></div>
      <div class="stat"><div class="k">発見済みの素因数</div><div class="v" id="p-found">なし</div></div>
      <div class="stat"><div class="k">未分解の残り</div><div class="v" id="p-remain">-</div></div>
    </div>
  </div>

  <div class="card hidden" id="result-card">
    <div class="result-title">結果</div>
    <div id="prime-note" class="prime-note hidden">この数は素数です。</div>
    <div class="factored" id="factored"></div>
    <table id="table">
      <thead><tr><th>素因数</th><th>指数</th><th>桁数</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="elapsed">計算時間: <b id="elapsed">-</b><span id="verify"></span></div>
  </div>

  <footer>試し割り → Miller-Rabin 素数判定 → Pollard's rho (Brent) の順で分解します。</footer>
</div>

<script src="app.js"></script>
</body>
</html>
